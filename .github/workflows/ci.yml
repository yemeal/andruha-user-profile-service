name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "2.4.1"
  POETRY_EXPORT_VERSION: "1.10.0"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  POETRY_NO_INTERACTION: "1"
  IMAGE_NAME: local/${{ github.event.repository.name }}:ci

jobs:
  quality-and-tests:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_USER: profile_test
          POSTGRES_PASSWORD: profile_test
          POSTGRES_DB: profile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U profile_test -d profile_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8.1.9-alpine3.24
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_PROFILE_POSTGRES_DSN: postgresql+asyncpg://profile_test:profile_test@127.0.0.1:5432/profile_test
      TEST_IDEMPOTENCY_POSTGRES_DSN: postgresql+asyncpg://profile_test:profile_test@127.0.0.1:5432/profile_test
      TEST_IDEMPOTENCY_REDIS_URL: redis://127.0.0.1:6379/0
      REQUIRE_INFRASTRUCTURE_TESTS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          check-latest: false

      - name: Install pinned build tools
        run: >-
          python -m pip install --disable-pip-version-check
          "poetry==${POETRY_VERSION}"
          "poetry-plugin-export==${POETRY_EXPORT_VERSION}"

      - name: Verify dependency metadata
        run: poetry check --lock

      - name: Install locked dependencies
        run: poetry sync --with dev --no-root --no-ansi

      - name: Ruff lint
        run: poetry run ruff check --output-format=github .

      - name: Ruff format
        run: poetry run ruff format --check .

      - name: ty type check
        run: poetry run ty check --error-on-warning

      - name: Reset coverage data
        run: poetry run coverage erase

      - name: Unit tests
        run: >-
          poetry run pytest tests/unit
          --cov=app
          --cov-branch
          --cov-report=
          --cov-fail-under=0

      - name: Integration tests
        run: >-
          poetry run pytest tests/integration
          --cov=app
          --cov-branch
          --cov-append
          --cov-report=
          --cov-fail-under=0

      - name: Enforce branch coverage
        run: |
          poetry run coverage report --show-missing --fail-under=80
          poetry run coverage xml

      - name: Export runtime dependency graph
        run: >-
          poetry export
          --only main
          --format requirements.txt
          --output "${RUNNER_TEMP}/requirements-runtime.txt"

      - name: Audit runtime dependencies
        run: >-
          poetry run pip-audit
          --requirement "${RUNNER_TEMP}/requirements-runtime.txt"
          --progress-spinner off

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  docker:
    name: Docker build and smoke test
    needs: [quality-and-tests, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build runnable image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test operational endpoints
        shell: bash
        run: |
          set -Eeuo pipefail

          service_port="$(awk '/^EXPOSE / { print $2; exit }' Dockerfile)"
          test -n "${service_port}"

          container_name="${GITHUB_REPOSITORY##*/}-smoke-${GITHUB_RUN_ID}"
          postgres_name="${container_name}-postgres"
          valkey_name="${container_name}-valkey"
          network_name="${container_name}-network"
          service_token="$(openssl rand -hex 32)"
          headers_file="$(mktemp)"
          live_body="$(mktemp)"
          ready_body="$(mktemp)"

          cleanup() {
            exit_code=$?
            if [ "${exit_code}" -ne 0 ]; then
              docker logs "${container_name}" || true
              docker logs "${postgres_name}" || true
              docker logs "${valkey_name}" || true
            fi
            docker rm --force --volumes "${container_name}" "${postgres_name}" "${valkey_name}" >/dev/null 2>&1 || true
            docker network rm "${network_name}" >/dev/null 2>&1 || true
            rm -f "${headers_file}" "${live_body}" "${ready_body}"
            exit "${exit_code}"
          }
          trap cleanup EXIT

          docker network create "${network_name}" >/dev/null
          docker run --detach --name "${postgres_name}" --network "${network_name}" \
            --env POSTGRES_USER=profile_test --env POSTGRES_PASSWORD=profile_test \
            --env POSTGRES_DB=profile_test postgres:17.10-bookworm
          docker run --detach --name "${valkey_name}" --network "${network_name}" \
            valkey/valkey:8.1.9-alpine3.24 # gitleaks:allow -- public Docker image tag

          for _ in {1..30}; do
            if docker exec "${postgres_name}" pg_isready -U profile_test -d profile_test \
              && docker exec "${valkey_name}" valkey-cli ping; then
              break
            fi
            sleep 1
          done

          service_args=(
            --network "${network_name}"
            --env "PROFILE_DATABASE_URL=postgresql+asyncpg://profile_test:profile_test@${postgres_name}:5432/profile_test"
            --env "PROFILE_REDIS_URL=redis://${valkey_name}:6379/0"
            --env "INTERNAL_API_TOKEN=${service_token}"
          )
          docker run --rm "${service_args[@]}" "${IMAGE_NAME}" alembic upgrade head

          docker run --detach \
            --name "${container_name}" \
            --publish "127.0.0.1:18080:${service_port}" \
            "${service_args[@]}" \
            "${IMAGE_NAME}"

          for _ in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18080/health/live >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent --show-error \
            --dump-header "${headers_file}" \
            --output "${live_body}" \
            http://127.0.0.1:18080/health/live
          grep --ignore-case --quiet '^x-request-id:' "${headers_file}"
          grep --quiet '"status":"ok"' "${live_body}"

          curl --fail --silent --show-error \
            --output "${ready_body}" \
            http://127.0.0.1:18080/health/ready
          grep --quiet '"status":"ready"' "${ready_body}"

          profile_id="00000000-0000-4000-8000-000000000001"
          for _ in 1 2; do
            status_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --request PUT --header "X-Service-Token: ${service_token}" \
              --header 'Content-Type: application/json' \
              --data '{"registered_at":"2026-01-01T00:00:00Z"}' \
              "http://127.0.0.1:18080/internal/v1/profiles/${profile_id}")"
            test "${status_code}" = 204
          done
          curl --fail --silent --show-error --head \
            "http://127.0.0.1:18080/internal/v1/profiles/${profile_id}"
          test "$(docker exec "${postgres_name}" psql -U profile_test -d profile_test -Atc \
            'SELECT (SELECT count(*) FROM profiles), (SELECT count(*) FROM user_settings), (SELECT count(*) FROM idempotency_records)')" = '1|1|1'
